name: heartbeat

# GitHub 60 kun repo'da harakat bo'lmasa scheduled workflow'larni o'chiradi.
# Har oy heartbeat.txt ni yangilab, keepalive jadvalini tirik saqlaymiz.

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat.txt
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "heartbeat $(date -u +%F)" || echo "no changes"
          git push
